[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acoustic-impedance-inversion"
version = "0.1.0"
description = "Model-based acoustic impedance inversion: 3D seismic -> AI volume -> horizontal slice"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "segyio>=1.9",
    "lasio>=0.31",
    "xarray>=2023.1",
    "pyvista>=0.43",
    "pykrige>=1.7",
    "gstools>=1.5",
    "pylops>=2.2",
    "plotly>=5.18",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools]
packages = [
    "datasets",
    "dataio",
    "inversion",
    "preprocessing",
    "mwd",
    "geostats",
    "fusion",
    "validation",
    "visualization",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
